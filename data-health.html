<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Health - Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DB</div>
        <div class="brand-text">
          <div class="brand-title">Admin Dashboard</div>
          <div class="brand-sub">MongoDB JSON</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="index.html">Overview</a>
        <a class="nav-item" href="users.html?view=top-users">Details</a>
        <a class="nav-item" href="edition.html">Edition</a>
        <button class="nav-item is-active">Data Health</button>
      </nav>
      <div class="sidebar-footer">
        <div class="status-pill">
          <span class="status-dot"></span>
          Data loaded from API
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="topbar-title">
          <div class="eyebrow" id="viewEyebrow">Data Health</div>
          <div class="topbar-row">
            <h1 id="viewTitle">Orphan Comments</h1>
            <div class="topbar-actions">
              <button class="icon-btn" id="prevView" type="button" aria-label="Previous view">&lt;</button>
              <button class="icon-btn" id="nextView" type="button" aria-label="Next view">&gt;</button>
              <a class="primary" href="index.html">Back to Overview</a>
            </div>
          </div>
        </div>
      </header>

      <section class="card">
        <div class="toolbar">
          <div class="toolbar-group">
            <strong id="totalRows">--</strong>
            <span class="table-meta" id="totalLabel">rows</span>
          </div>
          <div class="toolbar-group">
            <label for="pageSize" class="table-meta">Rows per page</label>
            <select id="pageSize" class="select">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>

        <div class="table-wide" id="healthTable"></div>

        <div class="pager">
          <button class="page-btn" id="prevPage">Previous</button>
          <div class="table-meta" id="pageInfo">Page -- of --</div>
          <button class="page-btn" id="nextPage">Next</button>
        </div>
      </section>
    </main>
  </div>

  <script src="data-health.js"></script>
</body>
</html>
